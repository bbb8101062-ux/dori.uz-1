<!DOCTYPE html>
<html lang="uz">
<head>

<title>Notebook Market</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

        <button>Savatga qo'shish</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1517336714739-489689fd1ca8?w=500">
        <h3>ASUS TUF Gaming</h3>
        <p>15 499 000 so'm</p>
        <button>Savatga qo'shish</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1593642702821-c8da6771f0c6?w=500">
        <h3>Lenovo LOQ</h3>
        <p>13 299 000 so'm</p>
        <button>Savatga qo'shish</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?w=500">

</section>

</body>
</html>
